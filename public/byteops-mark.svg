<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ByteOps Digital Systems mark">
  <title>ByteOps mark — cloud with speed lines</title>
  <!-- Cloud outline, recreated from byte.png and modernized: rounded stroke, open right side -->
  <path
    d="M14 44
       C10 38 12 30 19 26
       C22 24 25 24 27 24
       C29 15 38 9 48 12
       C53 14 56 17 57.5 21"
    fill="none"
    stroke="#1E3A5F"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Lower cloud hook -->
  <path
    d="M14 44
       C14 52 21 57 31 56.5
       C38 56 43 53 44.5 48.5"
    fill="none"
    stroke="#1E3A5F"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Speed bars -->
  <rect x="34" y="24" width="18" height="5" rx="2.5" fill="#1E3A5F"/>
  <rect x="29" y="33" width="23" height="5" rx="2.5" fill="#1E3A5F"/>
  <!-- Terminal pixel -->
  <rect x="29" y="42" width="5" height="5" rx="1.2" fill="#1E3A5F"/>
  <rect x="38" y="42" width="9" height="9" rx="1.6" fill="#007BFF"/>
</svg>
